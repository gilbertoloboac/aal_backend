version: '3.9'

services:
  web:
    build: .
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    expose:
      - "8000"
    environment:
      - DEBUG=False  # Adicione variáveis de ambiente necessárias
    command: gunicorn --bind 0.0.0.0:8000 seu_projeto.wsgi:application  # Garante o comando correto
    networks:
      - app_network

  nginx:
    image: nginx:alpine  # Versão mais leve
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      - web
    networks:
      - app_network
    healthcheck:  # Monitoramento de saúde
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  media:
  staticfiles:

networks:
  app_network:
    driver: bridge