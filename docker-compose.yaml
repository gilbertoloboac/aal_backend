version: '3.9'

services:
  web:
    build: .
    container_name: django_app
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles  # Adicione para arquivos estáticos
    expose:
      - "8000"  # Gunicorn/Django padrão

  nginx:
    image: nginx:latest
    container_name: nginx_media
    ports:
      - "8081:80"  # Host:8081 -> Container:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Substitua o arquivo principal
      - media:/app/media
      - staticfiles:/app/staticfiles  # Adicione para arquivos estáticos
    depends_on:
      - web

volumes:
  media:
  staticfiles:  # Adicione para persistência de arquivos estáticos